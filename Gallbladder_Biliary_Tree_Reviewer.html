<style>

}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{

button{font-family:inherit;cursor:pointer;}

}

.brand .drop{
  width:26px;height:26px;border-radius:50% 50% 50% 0;
  background:linear-gradient(135deg,var(--bile-yellow),var(--bile-yellow-deep));
  transform:rotate(45deg);flex:none;
}

  flex:1;min-width:160px;max-width:340px;
  border:1px solid var(--line);border-radius:999px;
  padding:8px 16px;font-size:.88rem;background:#fff;
  font-family:'DM Sans',sans-serif;
}
#searchbox:focus{outline:2px solid var(--teal);}
#progressWrap{flex:none;display:flex;align-items:center;gap:8px;font-size:.75rem;color:var(--ink-soft);}
#progressBar{width:90px;height:6px;background:var(--pearl);border-radius:4px;overflow:hidden;}
#progressFill{height:100%;width:0%;background:var(--teal);transition:width .3s;}
#darkToggle{
  border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:.8rem;font-weight:700;color:var(--teal-deep);
}
nav#tabnav{
  max-width:1280px;margin:0 auto;padding:0 20px 10px;
  display:flex;gap:6px;overflow-x:auto;
  scrollbar-width:thin;
}
nav#tabnav::-webkit-scrollbar{height:5px;}
nav#tabnav::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px;}
.tabbtn{
  white-space:nowrap;border:1px solid var(--line);background:#fff;
  padding:9px 16px;border-radius:999px;font-size:.82rem;font-weight:700;
  color:var(--ink-soft);transition:all .18s;
}
.tabbtn:hover{border-color:var(--teal);color:var(--teal-deep);}
.tabbtn.active{background:var(--teal);border-color:var(--teal);color:#fff;}

main{max-width:1080px;margin:0 auto;padding:28px 20px 100px;}
.panel{display:none;animation:fadein .35s ease;}
.panel.active{display:block;}
@keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

  font-size:1.9rem;border-bottom:3px solid var(--bile-yellow);

}

  font-size:1.15rem;color:var(--teal);margin-top:34px;

.card{

details.concept{

}
details.concept summary{
  cursor:pointer;list-style:none;padding:14px 18px;font-weight:700;

}

details.concept summary::after{content:"+";font-size:1.3rem;color:var(--teal);transition:transform .2s;}
details.concept[open] summary::after{transform:rotate(45deg);}
details.concept .body{padding:16px 20px;}

.callout{border-radius:12px;padding:14px 18px;margin:12px 0;font-size:.94rem;border:1px solid transparent;}

.callout.pitfall{background:var(--danger-pale);border-color:#e3b3a6;}

table{width:100%;border-collapse:collapse;margin:14px 0;font-size:.9rem;background:#fff;border-radius:10px;overflow:hidden;box-shadow:var(--shadow);}

  background:var(--teal);color:#fff;text-align:left;padding:10px 12px;font-family:'Syne',sans-serif;

/* =========================================================

const TABS = [
  {id:'overview', label:'Overview'},
  {id:'anatomy', label:'1. Anatomy & Diagnostics'},

const nav = document.getElementById('tabnav');
TABS.forEach(t=>{

  b.className='tabbtn'; b.textContent=t.label; b.dataset.tab=t.id;
  b.onclick=()=>showTab(t.id);

});

function showTab(id){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));

}

<section class="panel" id="panel-overview">
<h2 class="section-title">Overview &amp; High-Yield Map</h2>

<div class="card">
<h4>Learning Objectives (per lecture)</h4>
<ul>
<li>Discuss relevant anatomy and physiology of the biliary system.</li>
<li>Recognize common "surgical" diseases of the gallbladder/bile ducts encountered in everyday practice.</li>
<li>Know the diagnostic options, their rationale, and how to interpret them.</li>
<li>Know management — including urgency, triaging, and prognostication.</li>
</ul>
</div>

<div class="callout must"><b>⭐ Must Know — The Big Picture</b><br>
The gallbladder concentrates and stores bile made by the liver, releasing it into the duodenum in response to a fatty meal (via CCK). Almost every disease in this topic is a variation on one theme: <b>something blocks bile flow</b> — a stone, a stricture, or a tumor — at a specific level (gallbladder neck/cystic duct, common bile duct, ampulla, or intrahepatic ducts). Where the block sits determines the clinical picture, the imaging findings, and the operation.
</div>

<h3 class="subhead">Typical "3 F's" Patient Profile</h3>
<div class="flow">
<div class="node">Female</div><div class="arrow">+</div>
<div class="node">Fat</div><div class="arrow">+</div>
<div class="node">Forty (age)</div>
</div>
<p style="font-size:.85rem;color:var(--ink-soft)">Classic gallstone profile — but stones can occur in men, the elderly, and even patients &lt;20 years old.</p>

<h3 class="subhead">Roadmap of the Lecture</h3>
<table>
<thead><tr><th>Section</th><th>Core Idea</th></tr></thead>
<tbody>
<tr><td><b>Anatomy &amp; Diagnostics</b></td><td>Gallbladder/biliary tree anatomy, Calot's triangle, and the imaging ladder (US → CT → MRCP → ERCP/PTC/IOC)</td></tr>
<tr><td><b>Bile Physiology</b></td><td>Bile composition, secretion stimulants, and the "safe zone" that keeps cholesterol soluble</td></tr>
<tr><td><b>Cholelithiasis</b></td><td>Gallstones — risk factors, presentation, diagnosis, complications, and treatment (timing of cholecystectomy)</td></tr>
<tr><td><b>Choledochal Cyst</b></td><td>Congenital biliary dilations — 5 types, malignancy risk, management per type</td></tr>
<tr><td><b>Benign &amp; Inflammatory / Cholangitis</b></td><td>Acalculous cholecystitis, GB polyp, choledocholithiasis, hepatolithiasis, cholangitis, PSC</td></tr>
<tr><td><b>Neoplasms</b></td><td>Gallbladder carcinoma and cholangiocarcinoma — staging and resection strategy</td></tr>
</tbody>
</table>

<h3 class="subhead">Key Definitions</h3>
<div class="two-col">
<div class="card"><h4>Cholelithiasis</h4><p>Stones anywhere in the biliary tree.</p></div>
<div class="card"><h4>Cholecystolithiasis</h4><p>Stones specifically in the gallbladder.</p></div>
<div class="card"><h4>Choledocholithiasis</h4><p>Stones in the common bile duct (CBD).</p></div>
<div class="card"><h4>Hepatolithiasis</h4><p>Stones within the intrahepatic bile ducts.</p></div>
<div class="card"><h4>Biliary Colic</h4><p>Intermittent RUQ/epigastric pain from transient cystic duct obstruction by a stone.</p></div>
<div class="card"><h4>Cholangitis</h4><p>Infection of the biliary tree, usually from obstruction + bacterial contamination.</p></div>
</div>

<div class="callout tip"><b>🧠 Exam Tip</b><br>
When a vignette gives you RUQ/epigastric pain, always ask: (1) Is there fever? (2) Is there jaundice? Presence of both (plus pain) = <b>Charcot's Triad</b> → think cholangitis. Fever alone with pain = acute cholecystitis. Painless jaundice in an older patient = think malignancy until proven otherwise.
</div>
</section>
`);

<script>

<section class="panel" id="panel-anatomy">
<h2 class="section-title">1. Gallbladder &amp; Biliary Tree — Anatomy and Diagnostics</h2>

<h3 class="subhead">A. Anatomy</h3>

<details class="concept" open><summary>Surrounding Structures <span class="badge lec">Lecture</span></summary>
<div class="body">
<p><b>Gallbladder:</b> a small organ attached to the inferior surface of the liver, sitting in the <b>gallbladder fossa</b> — a depression that also marks the division between the right and left hemi-livers.</p>
<p><b>Antrum:</b> distal part of the stomach; ends at the pylorus, which marks the start of the duodenum.</p>
<p><b>Duodenum:</b> demarcated from the stomach by the pylorus and from the jejunum by the <b>Ligament of Treitz</b> <span class="badge book">Schwartz 11th ed.</span> It forms a "C loop" with four parts — <i>Superior, Descending, Horizontal, Ascending</i> — and the ascending part ends at the Ligament of Treitz. The head of the pancreas sits within the C loop; the body and tail pass behind the stomach.</p>
</div></details>

<details class="concept"><summary>The Four Parts of the Gallbladder</summary>
<div class="body">
<p>Fundus → Body → Neck (infundibulum) → Cystic duct.</p>
<ul>
<li>Configuration of the neck varies person to person (long/narrow, tortuous, or bulbous).</li>
<li>The pouch at the neck is <b>Hartmann's pouch</b> — <span class="badge imp">⭐ clinically important</span>: this is where stones commonly lodge, causing obstruction, pain, or acute cholecystitis.</li>
<li>The cystic duct is the entry <i>and</i> exit route for bile into/out of the gallbladder.</li>
</ul>
</div></details>

<details class="concept"><summary>Biliary Drainage Pathway</summary>
<div class="body">
<p>Bile canaliculi (intrahepatic) → converge and enlarge → exit the liver at the <b>liver hilum</b> as the <b>right and left hepatic ducts</b> → join to form the <b>common hepatic duct (CHD)</b> → the <b>cystic duct</b> joins the CHD to form the <b>common bile duct (CBD)</b> → CBD travels down and empties at the <b>ampulla (of Vater)</b>.</p>
<p>The <b>pancreatic duct</b> joins the distal CBD through a common channel within the ampulla, typically at the junction of the 2nd and 3rd portions of the duodenum.</p>
<div class="flow">
<div class="node">Intrahepatic ducts</div><div class="arrow">→</div>
<div class="node">R + L hepatic ducts</div><div class="arrow">→</div>
<div class="node">Common hepatic duct</div><div class="arrow">→</div>
<div class="node">+ Cystic duct = CBD</div><div class="arrow">→</div>
<div class="node">Ampulla of Vater</div><div class="arrow">→</div>
<div class="node">Duodenum</div>
</div>
</div></details>

<details class="concept"><summary>Sphincter of Oddi &amp; the Gallbladder as a Reservoir</summary>
<div class="body">
<p>The Sphincter of Oddi keeps the ducts closed during fasting. When closed, bile flowing down the bile duct backs up into the gallbladder, which stores/concentrates it. The longer the fast, the more distended the gallbladder becomes. With each meal, the gallbladder contracts and pushes bile into the duodenum. <b>This is why patients must fast (≥8 hours)</b> before biliary ultrasound — a distended, bile-filled gallbladder is much easier to evaluate than a contracted one.</p>
</div></details>

<details class="concept"><summary>Vascular Anatomy &amp; the Portal Triad</summary>
<div class="body">
<p><b>Portal vein</b> — lies behind the bile duct; the main inflow vasculature of the liver. In pancreatic surgery it divides the pancreatic head (right) from the body (left); the neck of the pancreas sits anterior/middle to the portal vein.</p>
<p><b>Arterial supply:</b> celiac trunk → common hepatic artery → branches to duodenum/pancreas via the gastroduodenal artery → proper hepatic artery → divides into R and L hepatic arteries. The <b>cystic artery</b> arises off the right hepatic artery and is the artery divided during cholecystectomy.</p>
<p><b>Portal triad</b> = artery + bile duct + portal vein, covered by fatty tissue called the <b>hepatoduodenal ligament</b> (connects liver to duodenum). In real surgery these structures are not as cleanly separated as in diagrams, especially in patients with more visceral fat.</p>
</div></details>

<details class="concept"><summary>Hepatocystic Triangle (Calot's Triangle) <span class="badge imp">⭐ High Yield</span></summary>
<div class="body">
<table>
<thead><tr><th>Border</th><th>Structure</th></tr></thead>
<tbody>
<tr><td>Medial</td><td>Common Hepatic Duct</td></tr>
<tr><td>Inferior</td><td>Cystic Duct</td></tr>
<tr><td>Superior</td><td>Inferior surface of the Liver</td></tr>
</tbody>
</table>
<p><b>Contents:</b></p>
<ul>
<li><b>Right hepatic artery</b> — formed by bifurcation of the proper hepatic artery.</li>
<li><b>Cystic artery</b> — arises from the right hepatic artery, traverses the triangle to supply the gallbladder; runs parallel to and somewhat behind the cystic duct, often behind the lymph node of Lund.</li>
<li><b>Lymph node of Lund (Calot's node)</b> — the sentinel node of the gallbladder.</li>
<li>Lymphatics.</li>
</ul>
<p>The lateral border of the bile duct marks the lateral border of the dissection plane during cholecystectomy — opening this triangle lets the surgeon safely identify and ligate the cystic duct/artery while keeping the CBD/CHD out of harm's way.</p>
</div></details>

<figure class="diagram">

<div class="callout pearl"><b>💡 Clinical Pearl</b><br>
Hartmann's pouch and the hepatocystic triangle are the two anatomic "hot spots" of biliary surgery: the pouch is where stones love to lodge (driving cholecystitis), and the triangle is where the surgeon must work carefully to avoid bile duct injury.
</div>

<div class="callout pitfall"><b>⚠️ Common Pitfall</b><br>
Don't confuse the <i>cystic</i> artery (divided during cholecystectomy, found within Calot's triangle) with the <i>right hepatic</i> artery (from which it arises) — injuring the right hepatic artery instead of the cystic artery is a recognized cholecystectomy complication.
</div>

<h3 class="subhead">B. Diagnostics — Non-Invasive Imaging</h3>

<div class="callout pearl"><b>💡 General Principle</b><br>
In any pathologic condition of the body, always go <b>non-invasive first</b>. Common to all bile duct, gallbladder, liver, and pancreas imaging: Ultrasound, CT, and MRI; HIDA scan is rarely used.
</div>

<table>
<thead><tr><th>Modality</th><th>Best For</th><th>Key Points</th></tr></thead>
<tbody>
<tr><td><b>Ultrasound</b></td><td>Gallbladder stones</td><td>Most widely available/cheapest; sensitivity &amp; specificity ~90% for GB stones. Poor for CBD stones (retroduodenal portion obscured by bowel gas). Stones = hyperechoic with posterior acoustic shadow. No radiation, no known side effects.</td></tr>
<tr><td><b>CT Scan</b></td><td>Tumors, obscure abdominal pain, dilated ducts</td><td>Initial test for suspected GB/biliary malignancy. Good if ducts are dilated only. Less sensitive for GB stones (may miss non-calcified stones). White = hyperdense (calcified/contrast-enhanced); black = hypodense (fluid/fat/bowel gas). Useful in emergencies.</td></tr>
<tr><td><b>MRI/MRCP</b></td><td>Bile duct stones</td><td>Best for choledocholithiasis (sensitivity 95%, specificity 89% <span class="badge book">Schwartz 11th</span>); preferred for precise biliary/pancreatic duct pathology; demonstrates strictures clearly. White = hyperintense, black = hypointense. No radiation but costly, cumbersome, and affected by claustrophobia/obesity/breath-hold ability.</td></tr>
<tr><td><b>HIDA Scan</b></td><td>Acute cholecystitis (rarely used)</td><td>⭐ Very sensitive for diagnosing acute cholecystitis; NOT used to detect stones alone. Non-visualization of the gallbladder = cystic duct obstruction (suggests acute cholecystitis). Used only when the other 3 modalities are inconclusive but suspicion remains high.</td></tr>
</tbody>
</table>

<h3 class="subhead">B. Diagnostics — Invasive Imaging</h3>
<p>Common to all three: contrast is injected because fluid-filled luminal organs (bile ducts) don't normally appear on plain x-ray.</p>

<table>
<thead><tr><th>Modality</th><th>Role</th><th>Notes</th></tr></thead>
<tbody>
<tr><td><b>ERCP</b></td><td>Diagnostic <i>and</i> therapeutic</td><td>Current recommendation: use ERCP if a therapeutic intervention (e.g. stone extraction) is intended, especially if a stone is highly suspected and confirmed on non-invasive imaging. Complications: pancreatitis (most common — ⭐ <b>Post-ERCP pancreatitis</b>), bleeding, perforation, infection, radiation, need for anesthesia.</td></tr>
<tr><td><b>PTC / PTBD</b></td><td>PTC = diagnostic; PTBD = therapeutic</td><td>Percutaneous (through skin) + Transhepatic (through liver) + Cholangiography (visualize bile duct). Done if ERCP fails/obstruction is at the level of a bile duct tumor. PTBD = catheter placed for drainage if obstruction needs decompression.</td></tr>
<tr><td><b>IOC</b> (Intraoperative Cholangiogram)</td><td>Done during laparoscopic cholecystectomy</td><td>Normal cholangiogram = non-dilated bile duct, smooth tapering of distal CBD into ampulla/duodenum, smooth contrast passage, non-dilated intrahepatic ducts.</td></tr>
</tbody>
</table>

<div class="card">
<h4>How ERCP Works</h4>
<p>Contrast is passed orally → down the esophagus/stomach → antrum → C-loop of duodenum → junction of the 2nd/3rd portion (ampulla) → bile duct. If stones are seen, extraction can be done in the same sitting via <b>papillotomy/sphincterotomy</b> (widening the ampulla) followed by basket/balloon retrieval.</p>
</div>

<div class="callout must"><b>⭐ Summary — Typical Imaging Indications</b><br>
<table style="margin-top:8px;">
<thead><tr><th>Imaging</th><th>Indication</th></tr></thead>
<tbody>
<tr><td>Ultrasound</td><td>Typical biliary colic symptoms; documenting gallbladder stones</td></tr>
<tr><td>MRI/MRCP</td><td>Abdominal pain + jaundice + suspecting duct stones; detailed bile duct imaging</td></tr>
<tr><td>CT Scan</td><td>Elderly (~60 yo) with obscure abdominal pain, low suspicion for gallstones; assessing neoplasms and extent of involvement; emergencies</td></tr>
<tr><td>ERCP</td><td>Documented stones on MRI/US, or high suspicion of gallstones (young male with h/o gallstones + abdominal pain + jaundice). Diagnostic AND therapeutic.</td></tr>
</tbody>
</table>
</div>

<div class="callout tip"><b>🧠 Exam Tip</b><br>
If a question gives you a patient with a normal alkaline phosphatase and no dilated ducts but classic RUQ pain/fever/leukocytosis → the answer is usually <b>ultrasound</b>, not ERCP or CT. Save ERCP for confirmed/highly suspicious CBD stones.
</div>
</section>
`);
</script>

<section class="panel" id="panel-physio">
<h2 class="section-title">2. Bile Physiology</h2>

<div class="two-col">
<div class="card">
<h4>Bile Components <span class="badge book">Schwartz 11th</span></h4>
<ul>
<li>Water, cholesterol, protein, bile pigment, phospholipids (lecithin), bilirubin.</li>
<li><b>Bile salts:</b> cholate, chenodeoxycholate — synthesized in the liver from cholesterol.</li>
<li><b>Bile acids:</b> conjugated bile salts + taurine/glycine; ~95% of the bile acid pool is reabsorbed via the enterohepatic circulation.</li>
<li><b>Electrolytes:</b> Na, K, Ca, Cl — same concentration as plasma/ECF. <b>Sodium is the most abundant electrolyte.</b></li>
</ul>
</div>
<div class="card">
<h4>Bile Color</h4>
<ul>
<li><b>Orange/Yellow</b> — pigment bilirubin</li>
<li><b>Green</b> — oxidized form (biliverdin)</li>
<li>Both are products of hemolysis.</li>
</ul>
</div>
</div>

<div class="callout pitfall"><b>⚠️ High-Output Biliary Fistula</b><br>
Because sodium is bile's most abundant electrolyte, a high-output biliary fistula commonly causes <b>hyponatremia</b> and (to a lesser extent) hypokalemia.
</div>

<h3 class="subhead">Bile Formation &amp; Fistula Output</h3>
<div class="card">
<p><b>Normal adult:</b> produces 500–1000 mL of bile per day, secreted continuously into the bile canaliculi. Secretion responds to neurogenic, hormonal, and chemical stimuli.</p>
<p><b>Biliary fistula</b> — abnormal connection from a hollow organ (e.g., bile duct) to the exterior, from trauma or surgical complication.</p>
<ul>
<li>Draining <b>&gt;1 L/day</b> → suggests <b>complete distal obstruction</b>.</li>
<li>Draining <b>100–200 mL/day</b> → most bile is passing normally through the duodenum.</li>
</ul>
</div>

<h3 class="subhead">Stimulants of Bile Secretion</h3>
<div class="two-col">
<div class="card"><h4>1. Proteins, Fatty Acids, HCl</h4><p>Entry of food (proteins/fats) from stomach → duodenum stimulates <b>S cells</b> to secrete <b>Secretin</b>, which stimulates bile secretion, gallbladder contraction, and pancreatic fluid secretion.</p></div>
<div class="card"><h4>2. Cholecystokinin (CCK)</h4><p>Has a direct contractile effect on the gallbladder.</p></div>
<div class="card"><h4>3. Parasympathetic (Vagus)</h4><p>Via hepatic branches → increases bile secretion. Sympathetic stimulation (via celiac plexus) is <b>inhibitory</b> for bile/pancreatic secretion and also carries sensory innervation of the biliary tree/pancreas — hence <b>celiac plexus block</b> for pancreatic pain control.</p></div>
</div>

<div class="callout must"><b>⭐ Must Know — The Cholesterol "Safe Zone"</b><br>
Bile's three main components — lecithin/phospholipids, cholesterol, and bile salts — exist in equilibrium so cholesterol stays soluble. When cholesterol intake rises, the balance shifts out of the "safe zone," promoting sedimentation → cholesterol becomes insoluble → precipitates out → <b>gallstone formation</b>. <span class="badge book">Schwartz 10th ed.</span>: "When cholesterol concentrations exceed the ability of the bile salts and phospholipid to maintain solubility, the cholesterol precipitates out of solution into a solid, forming a cholesterol stone."
</div>

<text x="250" y="162" text-anchor="middle" font-size="9" fill="#565f5a">supersaturated zone</text>

<div class="callout pearl"><b>💡 Clinical Pearl</b><br>
Bile Stones — Left (dark/black or brown) = <b>Pigment stones</b> (bile stasis, obstruction, or bacterial infection); Right (lighter, lobulated) = <b>Cholesterol stones</b>. Majority of "cholesterol stones" are actually mixed but ≥70% cholesterol by weight. Most cholesterol stones (&gt;90%) are radiolucent; calcium bilirubinate makes stones more radiopaque.

<section class="panel" id="panel-stones">
<h2 class="section-title">3. Stones — Cholelithiasis</h2>
<p>Affects <b>10–15% of adults</b>. Gallstones are either <b>cholesterol stones</b> or <b>pigment stones</b> (black or brown).</p>

<h3 class="subhead">Risk Factors <span class="badge imp">⭐</span></h3>
<div class="card">
<ul>
<li><b>Obesity, Female, High Cholesterol</b> — higher cholesterol turnover/secretion into bile → precipitation.</li>
<li><b>Genetic</b> — family history of gallstone disease.</li>
<li><b>Ethnic background</b> — Southeast Asians, East Asians, Latin, Native/Indian-Americans have higher risk.</li>
<li><b>Rapid weight loss</b> — bariatric surgery/rapid weight loss imbalances bile stimulants, promoting stone formation.</li>
<li><b>Pregnancy/OCPs</b> — hormonal milieu alters cholesterol metabolism/creates relative cholestasis. Slight increase in risk with OCPs, but <b>no recommendation to stop OCPs/HRT</b> for this reason alone.</li>
<li><b>Hemolytic disease</b> — increased bilirubin turnover → pigment stones.</li>
<li><b>Somatostatin/Somatostatin analogs</b> — inhibits gallbladder contraction and bile/pancreatic secretion → cholestasis → stone formation (seen in long-term analog use or somatostatinoma).</li>
<li><b>Gastric/duodenal/ileal surgery</b> — interrupts parasympathetic stimulation or CCK response, reducing gallbladder contractility; terminal ileum resection decreases enterohepatic bile salt reabsorption.</li>
</ul>
</div>

<h3 class="subhead">Clinical Presentation</h3>
<div class="flow">
<div class="node">Asymptomatic</div>
<div class="node">Symptomatic</div>
<div class="arrow">→</div>
<div class="node">Acute (hrs–days)</div>
<div class="node">Chronic (mos–yrs, intermittent)</div>
</div>

<div class="callout must"><b>⭐ RUQ/Epigastric Pain — Biliary Colic</b><br>
<ul>
<li>Radiates to the back — epigastric pain → mid-back; RUQ pain → right scapular area/shoulder.</li>
<li>Intermittent, colicky ("humihilab") — related to gallbladder spasm against an obstructing stone at the cystic duct/neck.</li>
<li>± postprandial, especially after fatty meals; may cause nausea/vomiting, dyspepsia, bloating.</li>
<li>Recurrent pain = <b>chronic cholecystitis</b> → surgery is warranted.</li>
</ul>
</div>

<h3 class="subhead">Diagnosis</h3>
<div class="card">
<p><b>Abdominal ultrasound</b> = standard/confirmatory diagnostic test — wide availability, high accuracy for gallstones.</p>
<p>When a stone lodges in the cystic duct/neck: patient develops either <b>acute cholecystitis</b> or <b>gallbladder hydrops</b> (marked distension, white "milk of calcium"/mucoid bile).</p>
</div>

<h3 class="subhead">Complications <span class="badge imp">⭐ Must Know</span></h3>
<table>
<thead><tr><th>Complication</th><th>Key Feature</th></tr></thead>
<tbody>
<tr><td><b>Acute cholecystitis</b></td><td>Most common complication; cystic duct obstruction → distention, inflammation, edema; RUQ tenderness, ± Murphy's sign, ± fever (late sign), usually NO jaundice (unless Mirizzi syndrome)</td></tr>

<tr><td><b>Gallbladder hydrops</b></td><td>Neck/cystic duct obstruction; mucosal glands keep secreting mucus → bile turns white; treated by cholecystectomy</td></tr>

<div class="callout pitfall"><b>⚠️ Common Pitfall</b><br>
Postoperative adhesions remain the <b>overall</b> most common cause of intestinal obstruction — gallstone ileus is uncommon but must be recognized because its surgery differs from adhesiolysis (requires enterotomy + stone extraction, ± cholecystectomy/fistula takedown).
</div>

<div class="callout pearl"><b>💡 Mirizzi Syndrome</b><br>
A large stone impacted in the gallbladder neck/cystic duct causes external compression (not intrinsic obstruction) of the common hepatic duct due to surrounding edema/inflammation — functional narrowing without a duct stone. Explains why acute cholecystitis can rarely present with jaundice.
</div>

<h3 class="subhead">Management &amp; Treatment</h3>

<div class="vs-wrap">
<div><h4>Asymptomatic</h4>
<p><b>Expectant management</b> — no treatment needed. Relative indications for <b>prophylactic cholecystectomy</b> exist (to prevent cholecystitis, pancreatitis, jaundice):</p>
<ul>
<li>Limited access to surgical care (e.g., remote areas)</li>
<li>Seafarers in the Philippines not cleared to work with stones</li>
<li><b>Porcelain gallbladder</b> — heavily calcified GB wall; classically an indication due to high gallbladder cancer risk, though newer studies debate this. All are <b>relative</b>, none absolute.</li>
</ul>
</div>
<div><h4>Symptomatic</h4>
<p>Standard treatment: <b>Cholecystectomy</b> (laparoscopic is standard — safer, faster recovery, less pain; open reserved when lap cannot be completed).</p>
<ul>
<li><b>Immediate</b> cholecystectomy — as soon as admitted</li>
<li><b>Early</b> cholecystectomy — within 24–72 hrs; <b>preferred for acute cases</b></li>
<li><b>Late</b> cholecystectomy — beyond 72 hrs, or interval elective after discharge</li>
</ul>
<p>Rule: do cholecystectomy before sending the patient home. Acute GB = edematous/harder to operate; delaying lets inflammation subside but many patients don't improve while waiting — most surgeons now prefer <b>early</b> cholecystectomy.</p>
</div>
</div>

<div class="card">
<h4>Percutaneous Cholecystostomy</h4>
<p>For patients who are toxic/unstable/have comorbidities requiring correction before surgery. A drain (pigtail catheter) is placed through the abdominal wall, right liver lobe, into the gallbladder to drain infected/blocked bile and relieve inflammation. <b>Gallbladder is drained, not removed</b>; elective cholecystectomy follows once the patient is fit.</p>
</div>

<div class="callout pitfall"><b>⚠️ Absolute Contraindications to Laparoscopic Cholecystectomy</b> <span class="badge book">Schwartz 10th</span><br>
Hemodynamic instability · Uncontrolled coagulopathy · Frank peritonitis · COPD · CHF — these require open cholecystectomy instead.
</div>

<h3 class="subhead">Laparoscopic Cholecystectomy — Key Steps</h3>
<div class="flow">
<div class="node">1. Trocar placement</div><div class="arrow">→</div>
<div class="node">2. Retract fundus/infundibulum</div><div class="arrow">→</div>
<div class="node">3. Open peritoneum, enter Triangle of Calot</div><div class="arrow">→</div>
<div class="node">4. Achieve Critical View of Safety</div><div class="arrow">→</div>
<div class="node">5. Clip &amp; divide cystic duct/artery</div><div class="arrow">→</div>
<div class="node">6. Dissect GB off liver bed</div>
</div>

<div class="callout must"><b>⭐ Critical View of Safety</b><br>
Requires the hepatocystic triangle be cleared of fat/fibrous tissue, and the lower third of the gallbladder separated from the liver, to clearly expose the <b>cystic plate, cystic artery, and cystic duct</b>. This tells the surgeon the CBD is NOT involved, allowing safe division of the cystic duct — the single most important safety maneuver to prevent bile duct injury.
</div>

<h3 class="subhead">Complications of Cholecystectomy</h3>
<div class="card">
<h4>Bile Duct Injury (&lt;0.5%) — the most dreaded complication</h4>
<p><b>Manifestations:</b> abdominal pain, <b>jaundice</b> ⭐, sepsis — may appear days to weeks post-op. Comes as complete transection, bile leak, stricture, or combination with infection.</p>
<p>Work-up: request <b>ERCP or MRI</b> if bile leak suspected — MRI helps assess injury extent prior to surgical repair.</p>
<p><b>Treatment:</b> reconnect bile to bowel — <b>Biliary-enteric anastomosis</b>:</p>
<ul>
<li><b>Roux-en-Y Choledochojejunostomy</b> — for common bile duct level</li>
<li><b>Hepaticojejunostomy</b> — for injury at/above the cystic duct level (hepatic duct)</li>
</ul>
</div>

<div class="card">
<h4>Perioperative Care</h4>
<ul>
<li>CBC and LFTs should be obtained preoperatively <span class="badge book">Schwartz 10th</span>.</li>
<li>DVT prophylaxis — low molecular weight heparin + compression stockings.</li>
</ul>
</div>

<div class="callout tip"><b>🧠 Exam Tip</b><br>
"Fever, chills, abdominal pain, jaundice + dilated intrahepatic AND extrahepatic biliary tree" on ultrasound → points to obstructive cholangitis → <b>ERCP with sphincterotomy</b> is the answer (not straight to laparoscopic cholecystectomy).
</div>

</section>
`);

<section class="panel" id="panel-cyst">
<h2 class="section-title">4. Congenital Anomaly — Choledochal Cyst</h2>

<div class="card">
<h4>Definition &amp; Etiology</h4>
<p>Congenital cystic dilatations of the extrahepatic and/or intrahepatic biliary tree. Affects <b>females 3–8× more</b> than males; typically found in infancy or childhood. Idiopathic, but weakness of the bile duct wall plus increased pressure from partial biliary obstruction is believed to contribute.</p>
<p><b>Key mechanism:</b> anomalous pancreaticobiliary duct junction — the pancreatic duct joins the CBD <i>outside</i> the duodenal wall, creating a long common channel (&gt;1.5 cm). This allows free reflux of pancreatic secretions into the biliary tract → inflammation, increased biliary pressure, cyst formation.</p>
</div>

<h3 class="subhead">Manifestations</h3>
<div class="callout must"><b>⭐ Classic Triad</b><br>
Abdominal pain + Jaundice (may be intermittent) + Palpable mass (appreciable in pediatric patients due to a thin abdominal wall). Cholangitis may also occur.
</div>

<h3 class="subhead">Diagnosis</h3>
<div class="card">
<ul>
<li><b>Ultrasonography or CT scanning</b> — confirms the diagnosis.</li>
<li><b>ERCP or MRCP</b> — formally assesses biliary anatomy and plans surgical treatment.</li>
</ul>

<section class="panel" id="panel-benign">
<h2 class="section-title">5. Benign Lesions, Inflammatory Conditions &amp; Cholangitis</h2>

<h3 class="subhead">A. Acalculous Cholecystitis</h3>
<div class="card">
<p><b>Definition:</b> acute gallbladder inflammation in the <i>absence</i> of gallstones. Occurs in critically ill patients (ICU, severe burns, severe trauma).</p>
<p><b>Pathology:</b> gallbladder distention, bile stasis, ischemia (low-flow state), prolonged NPO, parenteral nutrition.</p>
</div>

<p><b>Conscious patient</b> — similar to calculous cholecystitis (RUQ pain/tenderness, fever, leukocytosis).</p>

</div>
<div class="card"><h4>Treatment</h4>
<p>Urgent cholecystectomy if possible. If stable → laparoscopic cholecystectomy with broad-spectrum antibiotics/fluid resuscitation. If critically ill/unfit for surgery → <b>percutaneous cholecystostomy</b> is the best treatment.</p>
</div>
</div>
<div class="callout pearl"><b>💡 Philippine Context Pearl</b><br>
In the Philippines, acalculous cholecystitis is frequently a complication of tropical diseases (<b>dengue or typhoid fever</b>) — same presentation, but ultrasound shows an inflamed GB without stones, and these often <b>resolve spontaneously</b> with conservative management (unlike critically ill ICU patients). Acalculous cholecystitis basically never occurs in otherwise healthy people without a risk factor.
</div>

<h3 class="subhead">B. Gallbladder Polyp</h3>
<div class="card">
<p>Commonly seen incidentally, with or without gallstones. May be single or multiple. <b>Majority are benign.</b></p>
<table>
<thead><tr><th>Type</th><th>Risk</th></tr></thead>
<tbody>
<tr><td>Multiple polyps (usually cholesterol polyps)</td><td>More likely benign</td></tr>
<tr><td>Adenomatous polyps (fleshy, solitary)</td><td>Risk for gallbladder cancer</td></tr>
</tbody>
</table>
<p><b>Presentation:</b> mostly asymptomatic; if RUQ pain occurs (rare), other causes must be ruled out before blaming the polyp.</p>
<p><b>Indications for surgery:</b> <b>≥1 cm</b> in size (polyps &lt;1 cm rarely become cancer), or symptomatic.</p>
</div>

<h3 class="subhead">C. Choledocholithiasis</h3>
<div class="card">
<h4>Primary vs. Secondary Stones</h4>
<table>
<thead><tr><th></th><th>Primary</th><th>Secondary</th></tr></thead>
<tbody>
<tr><td>Origin</td><td>Formed <i>within</i> the bile duct</td><td>Formed <i>outside</i> the duct (usually GB), migrate via cystic duct</td></tr>
<tr><td>Composition</td><td>Brown pigment type</td><td>Cholesterol stones (more common overall)</td></tr>
<tr><td>Association</td><td>Biliary stasis + infection; more common in Asian populations</td><td>Cholelithiasis (up to 20% of GB stone patients eventually develop CBD stones)</td></tr>
<tr><td>Surgical implication</td><td>May/may not have GB stones; multiple stones up to the liver; highly recurrent — cholecystectomy alone may not suffice, sometimes needs biliary bypass</td><td>After clearance, remove the source (cholecystectomy)</td></tr>
</tbody>
</table>
</div>

<div class="callout must"><b>⭐ Clinical Presentation</b><br>
Epigastric/RUQ pain, nausea/vomiting, jaundice, <b>acholic stool</b> (absent stercobilinogen → pale stool), <b>tea-colored urine</b> (conjugated bilirubin spills into urine), mild icterus. Pain may be intermittent (ball-valve effect of a partially impacted stone); complete impaction → severe progressive jaundice.
</div>

<h3 class="subhead">Diagnostics — LFTs &amp; Jaundice Interpretation</h3>
<div class="card">
<h4>Sample LFT Pattern (Obstructive Jaundice)</h4>
<table>
<thead><tr><th>Test</th><th>Result</th><th>Reference</th></tr></thead>
<tbody>
<tr><td>Total Bilirubin</td><td>2.09 mg/dL ↑</td><td>0.20–1.00</td></tr>
<tr><td>Conjugated Bilirubin</td><td>0.78 mg/dL ↑</td><td>0–0.20</td></tr>
<tr><td>Unconjugated Bilirubin</td><td>1.31 mg/dL ↑</td><td>0–0.80</td></tr>
<tr><td>Alkaline Phosphatase</td><td>115 U/L (normal)</td><td>50–136</td></tr>
</tbody>
</table>
<p>Obstructive jaundice usually shows ↑ total bilirubin with conjugated &gt; unconjugated, and ↑ ALP. Unconjugated may rise too if total bilirubin is very high, but the <i>ratio</i> still favors conjugated. Liver profile values must be interpreted <b>as a pattern</b>, not individually.</p>
</div>

<div class="two-col">
<div class="card"><h4>Where's the Problem? — Bilirubin Pattern</h4>
<ul>
<li><b>Unconjugated ↑ only</b> → prehepatic (hemolysis) or hepatic conjugation defect</li>
<li><b>Both conjugated + unconjugated ↑</b> → hepatocellular (e.g., hepatitis)</li>
<li><b>Conjugated ↑ predominant</b> → posthepatic/obstructive = <b>surgical jaundice</b></li>
</ul>
<p>Prehepatic + hepatic jaundice = <b>medical jaundice</b> (not corrected by surgery).</p>
</div>
<div class="card"><h4>Other Liver/Biliary Tests</h4>
<ul>
<li><b>ALT/AST</b> — elevated with hepatocyte inflammation/injury (hepatitis); may rise mildly with severe biliary obstruction too.</li>
<li><b>GGT</b> — marker of cholestasis; elevated with ALP/conjugated bilirubin strongly suggests biliary pathology.</li>
<li><b>Albumin</b> — synthesized by the liver; maintains oncotic pressure and transports drugs; decreases in chronic liver disease (e.g., cirrhosis).</li>
<li><b>PT/INR</b> — biliary obstruction impairs fat-soluble vitamin absorption (esp. Vitamin K–dependent factors II, VII, IX, X) → coagulopathy, ↑ PT/INR.</li>

</div>
</div>

<h3 class="subhead">Pathophysiology of Jaundice — Bilirubin Metabolism</h3>
<div class="flow">
<div class="node">Senescent RBC (120d lifespan)</div><div class="arrow">→</div>

<tr><td>CT Scan</td><td>Used when other abdominal pain causes are suspected; can show CBD obstruction with stone</td></tr>
<tr><td>ERCP</td><td>Done if confirmed/high suspicion of CBD stone; ampulla cannulation + cholangiography successful &gt;90% of cases; invasive, rarely purely diagnostic</td></tr>

<h3 class="subhead">Complications &amp; Treatment</h3>
<div class="two-col">
<div class="card"><h4>Complications</h4>
<ul><li>Cholangitis (gallstones = most common cause of biliary obstruction leading to cholangitis)</li><li>Pancreatitis</li><li>Biliary stricture (recurrent stones/infection/inflammation)</li></ul>

</ul>
</div>
</div>

<h3 class="subhead">D. Hepatolithiasis</h3>
<div class="card">
<p><b>Definition:</b> stones within the liver (intrahepatic ducts). <b>Endemic in East and Southeast Asia.</b></p>
<p><b>Etiology:</b> bile stasis, strictures, bacterial infection, parasitic infection (<i>Clonorchis</i> fluke, <i>Ascaris</i> — common in the Philippines, associated with poor hygiene/lower socioeconomic status), genetic factors.</p>
<p><b>Presentation:</b> RUQ/epigastric pain, jaundice, fever (if cholangitis), usually with multiple stones and strictures.</p>
</div>

<div class="card">
<h4>Diagnostics</h4>
<ul>
<li>↑ direct bilirubin, ALP, GGT</li>
<li>Ultrasound — dilated intrahepatic ducts, hyperechoic stones</li>
<li>CT/MRCP — locate strictures/stones (MRI shows hypointensities from stones + dilated ducts)</li>
<li>Cholangiogram (PTC/ERC) — multiple filling defects; more invasive but potentially therapeutic</li>

</div>

<div class="card">
<h4>Treatment</h4>
<ul>
<li>Drainage + stone extraction — percutaneous (PTBD), endoscopic, or surgical</li>
<li><b>Choledochojejunostomy</b> — for strictures/recurring stones (connects proximal duct to small intestine)</li>

</ul>
<p><b>Prognosis:</b> multiple recurrences expected; lower recurrence risk after hepatic resection in unilateral disease.</p>
</div>

<div class="callout must"><b>⭐ Complications of Hepatolithiasis</b><br>

</div>

<h3 class="subhead">E. Cholangitis</h3>
<div class="card">
<p>An important complication of <i>any</i> biliary obstruction — obstruction + significant bacterial contamination from the bowel = infection of the biliary tree. Gallstones are the most common cause; also from PSC, strictures, parasites, instrumentation, stents, partially obstructed biliary-enteric anastomosis.</p>
<p><b>Common organisms:</b> <i>E. coli, Klebsiella, S. faecalis, Enterobacter</i> sp., <i>Bacteroides fragilis</i>.</p>
</div>

<table style="margin-top:8px">
<thead><tr><th>Charcot's Triad</th><th>Reynold's Pentad (Severe cholangitis)</th></tr></thead>
<tbody>
<tr><td>RUQ/epigastric pain</td><td rowspan="3">Charcot's Triad<br>+ Shock<br>+ Altered mental status</td></tr>
<tr><td>Jaundice</td></tr>
<tr><td>Fever</td></tr>
</tbody>
</table>
</div>

<div class="card">
<h4>Treatment — Considered Very Urgent</h4>
<p>Patients can deteriorate within 24 hours.</p>
<ol>
<li><b>Broad-spectrum / Gram-negative coverage antibiotics</b> — started immediately</li>
<li><b>Biliary drainage</b> — stenting via ERCP, PTBD, or surgery</li>
<li><b>Resuscitation</b> — necessary if shock is present</li>
</ol>
</div>

<h3 class="subhead">F. Primary Sclerosing Cholangitis (PSC)</h3>
<div class="card">
<p><b>Definition:</b> inflammatory (multisegmental) strictures of the intra- and extrahepatic ducts.</p>
<p><b>Epidemiology:</b> autoimmune; mean age 30–45 years; M &gt; F (2:1); <b>⅔ associated with ulcerative colitis</b>.</p>
<p><b>Treatment:</b> corticosteroids, immunosuppressants, ursodeoxycholic acid; stenting; bilioenteric bypass for hilar stricture; liver transplantation (10–20% recurrence).</p>
</div>

<div class="callout tip"><b>🧠 Exam Tip — "If you see X → think Y"</b><br>
Young/middle-aged man + ulcerative colitis + progressive cholestatic jaundice with multisegmental strictures on MRCP → think <b>PSC</b>. Remember PSC is itself a major risk factor for <b>cholangiocarcinoma</b>.
</div>
</section>

<h2 class="section-title">6. Neoplasms</h2>
<div class="callout pearl"><b>💡 Shared Risk Concepts</b><br>

<li><b>CA 19-9</b> — most commonly used tumor marker (false positives with cholangitis, biliary obstruction, other GI/gyn neoplasms, Lewis antigen–negative patients); CA-125 and CEA also elevated but nonspecific</li>
<li>FNA (percutaneous/endoscopic) + biliary brushings — low sensitivity</li>
<li>Choledochoscopy with direct visualization/sampling — improves diagnosis but only in specialized centers</li>
</ul>
<p>Patients with potentially resectable disease should be offered surgical exploration based on radiographic findings and clinical suspicion.</p>
</div>

<h3 class="subhead">Treatment by Location</h3>
<table>
<thead><tr><th>Location</th><th>Procedure</th></tr></thead>
<tbody>
<tr><td>Intrahepatic</td><td>Hepatectomy</td></tr>
<tr><td>Hilar (perihilar)</td><td>Extended hepatectomy (major liver resection required — Whipple alone is not enough)</td></tr>
<tr><td>Distal</td><td>Pancreaticoduodenectomy (Whipple procedure)</td></tr>
<tr><td>Type IV Klatskin (bilateral duct/intrahepatic spread)</td><td>Unresectable or liver transplantation</td></tr>
</tbody>
</table>

<div class="two-col">
<div class="card"><h4>If Unresectable</h4>
<ul>
<li>Distal unresectable: Roux-en-Y hepaticojejunostomy + cholecystectomy + gastrojejunostomy to prevent gastric outlet obstruction</li>
<li>Nonoperative biliary decompression (stents via PTC-PTBD)</li>
<li>Adjuvant chemo/radiation — no proven survival benefit</li>
<li>Palliative chemo (Gemcitabine + Cisplatin) — low response rate, marginal benefit</li>
<li><b>Photodynamic therapy</b> — palliative, may prolong survival and improve QOL with biliary stents</li>
</ul>
</div>
<div class="card"><h4>Prognosis</h4>
<ul>
<li>Unresectable: median survival 5–8 months; most common cause of death = hepatic failure/cholangitis</li>
<li>Resectable perihilar: 10–30% 5-year survival (40% if negative margins)</li>
<li>Distal CBD: 30–50% 5-year survival</li>
<li>Operative mortality for perihilar disease: 6–8%</li>
</ul>
</div>
</div>

<div class="callout tip"><b>🧠 Exam Tip</b><br>
Elderly patient + <b>painless</b> jaundice → until proven otherwise, think <b>malignancy</b> (cholangiocarcinoma, pancreatic head CA, ampullary CA, or duodenal tumor obstructing the ampulla — collectively "periampullary tumors"). Small tumors can be localized by CT/MRI; large ones are often grouped together since the exact origin is hard to pinpoint.
</div>
</section>
`);

{tag:'Cholelithiasis', q:'What is Mirizzi syndrome?', a:'External compression of the common hepatic duct by a large stone impacted in the gallbladder neck/cystic duct, due to surrounding inflammation/edema.'},
{tag:'Cholelithiasis', q:'What are the absolute contraindications to laparoscopic cholecystectomy?', a:'Hemodynamic instability, uncontrolled coagulopathy, frank peritonitis, COPD, CHF.'},
{tag:'Cholelithiasis', q:'What is the preferred timing of cholecystectomy in acute cholecystitis?', a:'Early cholecystectomy, within 24–72 hours.'},
{tag:'Cholelithiasis', q:'What procedure is done for a critically ill patient with acute cholecystitis who is unfit for surgery?', a:'Percutaneous cholecystostomy (drain placement, not gallbladder removal).'},
{tag:'Cholelithiasis', q:'Name three relative indications for prophylactic cholecystectomy in asymptomatic gallstones.', a:'Limited access to surgical care (e.g., remote area), seafarers in the Philippines not cleared to work, porcelain gallbladder.'},
{tag:'Cholelithiasis', q:'What is the most dreaded complication of cholecystectomy and its classic triad of manifestations?', a:'Bile duct injury — abdominal pain, jaundice, sepsis.'},
{tag:'Cholelithiasis', q:'What two biliary-enteric anastomoses are used to repair bile duct injuries, and how do they differ?', a:'Choledochojejunostomy (CBD level) and hepaticojejunostomy (higher/hepatic duct level, e.g., for hilar strictures).'},
{tag:'Choledochal Cyst', q:'What is the classic triad of choledochal cyst?', a:'Abdominal pain, jaundice, and a palpable mass.'},
{tag:'Choledochal Cyst', q:'Which choledochal cyst type is most common, and what is its malignancy risk?', a:'Type I (fusiform dilatation of the CBD) — 80–90% of cases, malignancy risk >60%.'},
{tag:'Choledochal Cyst', q:'Which choledochal cyst type has the lowest malignancy risk and how is it managed?', a:'Type III (choledochocele) — ~2% risk; managed with sphincterotomy + surveillance rather than formal excision.'},
{tag:'Choledochal Cyst', q:'Which choledochal cyst type is Caroli disease, and what is its definitive treatment (with liver failure)?', a:'Type V — intrahepatic biliary cysts only; treated with liver transplantation.'},
{tag:'Choledochal Cyst', q:'How much higher is the cholangiocarcinoma risk in choledochal cyst patients vs. the general population?', a:'20–30 times higher.'},
{tag:'Benign/Inflammatory', q:'What defines acalculous cholecystitis, and in which patient population does it occur?', a:'Acute gallbladder inflammation without gallstones, typically in critically ill patients (ICU, severe burns, severe trauma).'},
{tag:'Benign/Inflammatory', q:'In the Philippine context, what tropical diseases are commonly associated with acalculous cholecystitis, and what is notable about their course?', a:'Dengue and typhoid fever — often resolve spontaneously, and conservative management is acceptable.'},
{tag:'Benign/Inflammatory', q:'What size threshold for a gallbladder polyp is an indication for cholecystectomy?', a:'≥1 cm (or if symptomatic).'},
{tag:'Benign/Inflammatory', q:'Which type of gallbladder polyp carries a risk for gallbladder cancer?', a:'Adenomatous polyps (fleshy, often solitary).'},
{tag:'Benign/Inflammatory', q:'Differentiate primary from secondary choledocholithiasis by stone origin and composition.', a:'Primary stones form within the bile duct itself (brown pigment); secondary stones form in the gallbladder and migrate down (cholesterol, more common).'},
{tag:'Benign/Inflammatory', q:'What stool and urine changes are classic for choledocholithiasis?', a:'Acholic (pale) stool and tea-colored urine.'},
{tag:'Benign/Inflammatory', q:'What LFT pattern is seen in obstructive (posthepatic) jaundice?', a:'Increased total and conjugated bilirubin (conjugated predominant) with increased alkaline phosphatase.'},
{tag:'Benign/Inflammatory', q:'What is hepatolithiasis and where is it endemic?', a:'Stones within the intrahepatic bile ducts, endemic to East and Southeast Asia.'},
{tag:'Benign/Inflammatory', q:'What parasite is classically associated with hepatolithiasis?', a:'Clonorchis (liver fluke); Ascaris is also implicated, especially in the Philippines.'},
{tag:'Benign/Inflammatory', q:'What is "Oriental Cholangiohepatitis"?', a:'Another name for recurrent pyogenic cholangitis, a complication of hepatolithiasis common in East Asia.'},
{tag:'Benign/Inflammatory', q:'What is Charcot\'s Triad?', a:'RUQ/epigastric pain, jaundice, and fever — classic for cholangitis.'},
{tag:'Benign/Inflammatory', q:'What is Reynold\'s Pentad and what does it indicate?', a:'Charcot\'s Triad + shock + altered mental status — indicates severe/suppurative cholangitis, a surgical emergency.'},
{tag:'Benign/Inflammatory', q:'What are the three pillars of cholangitis treatment?', a:'Broad-spectrum/gram-negative antibiotics, biliary drainage, and resuscitation.'},
{tag:'Benign/Inflammatory', q:'What organisms most commonly cause cholangitis?', a:'E. coli, Klebsiella, S. faecalis, Enterobacter sp., Bacteroides fragilis (enteric bacteria).'},
{tag:'Benign/Inflammatory', q:'What autoimmune condition is PSC associated with, and what is the typical demographic?', a:'Ulcerative colitis (⅔ of PSC patients); M>F (2:1), mean age 30–45 years.'},
{tag:'Neoplasms', q:'What is the most important risk factor for gallbladder carcinoma?', a:'Cholelithiasis.'},
{tag:'Neoplasms', q:'What is the most common histologic type of gallbladder carcinoma?', a:'Adenocarcinoma (~90%).'},
{tag:'Neoplasms', q:'What is the treatment for T1 gallbladder carcinoma?', a:'Laparoscopic cholecystectomy alone (5-year survival near 100%).'},
{tag:'Neoplasms', q:'What additional procedures are needed for T2 gallbladder carcinoma beyond cholecystectomy?', a:'Segmental liver resection (segments IVB/V) and regional lymphadenectomy (extended cholecystectomy).'},
{tag:'Neoplasms', q:'What is the classic presenting symptom of cholangiocarcinoma?', a:'Painless jaundice.'},
{tag:'Neoplasms', q:'What is the most common site of cholangiocarcinoma, and what is it called?', a:'The hilar region (bifurcation of hepatic ducts) — Klatskin tumor; accounts for ~50% of cases.'},
{tag:'Neoplasms', q:'What is the most commonly used tumor marker for cholangiocarcinoma?', a:'CA 19-9.'},
{tag:'Neoplasms', q:'What surgery is used for distal bile duct cholangiocarcinoma?', a:'Pancreaticoduodenectomy (Whipple procedure).'},
{tag:'Neoplasms', q:'What surgery is used for hilar (perihilar) cholangiocarcinoma?', a:'Extended hepatectomy (major liver resection), since Whipple alone is insufficient.'},
{tag:'Neoplasms', q:'What palliative therapy has been shown to prolong survival/improve quality of life in unresectable cholangiocarcinoma with biliary stents?', a:'Photodynamic therapy.'},
{tag:'Neoplasms', q:'What percentage incidence of gallbladder cancer is associated with porcelain gallbladder?', a:'Greater than 20%.'},
];

let fcOrder = FLASHCARDS.map((_,i)=>i);
let fcIndex = 0;
let fcSeen = new Set();

function fcPopulateFilter(){
  const sel = document.getElementById('fcFilter');
  const tags = ['All Sections', ...new Set(FLASHCARDS.map(f=>f.tag))];
  sel.innerHTML = tags.map(t=>'<option value="'+t+'">'+t+'</option>').join('');
  sel.onchange = ()=>{
    const v = sel.value;
    fcOrder = FLASHCARDS.map((_,i)=>i).filter(i=> v==='All Sections' || FLASHCARDS[i].tag===v);
    fcIndex = 0;
    document.getElementById('flashcard').classList.remove('flipped');
    fcRender();
  };
}
fcPopulateFilter();

function fcRender(){
  if(fcOrder.length===0) return;
  const card = FLASHCARDS[fcOrder[fcIndex]];
  document.getElementById('fcTagFront').textContent = card.tag;
  document.getElementById('fcTagBack').textContent = card.tag;
  document.getElementById('fcQuestion').textContent = card.q;
  document.getElementById('fcAnswer').textContent = card.a;
  fcSeen.add(fcOrder[fcIndex]);
  document.getElementById('fcProgress').textContent = 'Card '+(fcIndex+1)+' / '+fcOrder.length+'   ·   Seen: '+fcSeen.size+'/'+FLASHCARDS.length;
}
fcRender();

document.getElementById('flashcard').addEventListener('click', ()=>{
  document.getElementById('flashcard').classList.toggle('flipped');
});
document.getElementById('fcFlip').onclick = ()=> document.getElementById('flashcard').classList.toggle('flipped');
document.getElementById('fcNext').onclick = ()=>{
  fcIndex = (fcIndex+1) % fcOrder.length;
  document.getElementById('flashcard').classList.remove('flipped');
  fcRender();
};
document.getElementById('fcPrev').onclick = ()=>{
  fcIndex = (fcIndex-1+fcOrder.length) % fcOrder.length;
  document.getElementById('flashcard').classList.remove('flipped');
  fcRender();
};
document.getElementById('fcShuffle').onclick = ()=>{
  for(let i=fcOrder.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [fcOrder[i],fcOrder[j]] = [fcOrder[j],fcOrder[i]];
  }
  fcIndex=0;
  document.getElementById('flashcard').classList.remove('flipped');
  fcRender();
};
document.getElementById('fcReset').onclick = ()=>{
  fcSeen = new Set();
  fcIndex = 0;
  document.getElementById('flashcard').classList.remove('flipped');
  fcRender();
};

document.addEventListener('keydown', e=>{
  if(document.getElementById('panel-flash').classList.contains('active')){
    if(e.code==='Space'){ e.preventDefault(); document.getElementById('flashcard').classList.toggle('flipped'); }
    if(e.key==='ArrowRight'){ document.getElementById('fcNext').click(); }
    if(e.key==='ArrowLeft'){ document.getElementById('fcPrev').click(); }
  }
});
</script>

<script>
const QUIZ = [
{sec:'Anatomy', q:'What is the pouch at the neck of the gallbladder called?', opts:['Morison\'s pouch','Hartmann\'s pouch','Douglas pouch','Calot\'s pouch'], correct:1, exp:'Hartmann\'s pouch is the pouch at the GB neck where stones commonly lodge, causing obstruction. Morison\'s pouch is the hepatorenal recess; Douglas pouch is the rectouterine pouch; "Calot\'s pouch" is not a real structure — Calot\'s refers to the triangle.'},
{sec:'Anatomy', q:'Which artery is classically ligated within Calot\'s triangle during cholecystectomy?', opts:['Right hepatic artery','Gastroduodenal artery','Cystic artery','Left hepatic artery'], correct:2, exp:'The cystic artery, which arises from the right hepatic artery and traverses the triangle to supply the gallbladder, must be identified and divided.'},
{sec:'Anatomy', q:'What forms the superior border of the hepatocystic (Calot\'s) triangle?', opts:['Cystic duct','Common hepatic duct','Inferior surface of the liver','Common bile duct'], correct:2, exp:'Superior border = inferior surface of the liver. Medial = common hepatic duct; inferior = cystic duct.'},
{sec:'Anatomy', q:'The "Critical View of Safety" is primarily meant to prevent injury to which structure?', opts:['Portal vein','Common bile duct','Pancreatic duct','Duodenum'], correct:1, exp:'Achieving the Critical View confirms the surgeon is dealing with the cystic duct/artery and NOT the common bile duct, preventing bile duct injury.'},
{sec:'Anatomy', q:'Where does the pancreatic duct typically join the common bile duct?', opts:['At the porta hepatis','At the ampulla of Vater','At the neck of the gallbladder','At the ligament of Treitz'], correct:1, exp:'The pancreatic duct joins the distal CBD through a common channel within the ampulla of Vater, near the 2nd/3rd portion of the duodenum.'},
{sec:'Anatomy', q:'Why must patients fast before undergoing biliary ultrasound?', opts:['To reduce radiation exposure','To distend the gallbladder for better visualization','To prevent contrast allergy','To relax the sphincter of Oddi'], correct:1, exp:'Fasting keeps the sphincter of Oddi closed, allowing the gallbladder to fill and distend with bile, which improves detection of stones/lesions.'},
{sec:'Diagnostics', q:'What is the imaging modality of choice for suspected gallbladder stones?', opts:['CT scan','MRCP','Ultrasound','ERCP'], correct:2, exp:'Ultrasound is the most widely used, cheapest, and most sensitive/specific (90%) test for gallbladder stones.'},
{sec:'Diagnostics', q:'What is the imaging modality of choice when there is high suspicion of stones in the bile duct?', opts:['Ultrasound','CT Scan','MRI/MRCP','Plain X-ray'], correct:2, exp:'MRI/MRCP has the highest sensitivity (95%) and specificity (89%) for choledocholithiasis and provides the best anatomic detail of bile ducts.'},
{sec:'Diagnostics', q:'A 60-year-old male has RUQ pain, fever, nausea, leukocytosis, and NORMAL alkaline phosphatase. What is the best initial diagnostic test?', opts:['Abdominal CT scan','Abdominal ultrasound','ERCP','Abdominal X-ray'], correct:1, exp:'With normal ALP (i.e., low suspicion of obstruction/ductal disease), ultrasound remains the initial diagnostic procedure of choice for suspected gallbladder disease.'},
{sec:'Diagnostics', q:'A patient has fever, chills, abdominal pain, jaundice, and BOTH dilated intrahepatic and extrahepatic biliary trees on ultrasound. What is the recommended management?', opts:['Emergency laparoscopic cholecystectomy','Emergency open biliary decompression with drains','ERCP with sphincterotomy','Exploratory laparotomy with duodenotomy'], correct:2, exp:'This presentation is consistent with cholangitis from ductal obstruction; ERCP with sphincterotomy provides both diagnosis and therapeutic decompression.'},
{sec:'Diagnostics', q:'What is the most common complication of ERCP?', opts:['Bleeding','Perforation','Post-ERCP pancreatitis','Infection'], correct:2, exp:'Because the pancreatic duct and distal bile duct are close together, instrumentation during ERCP/sphincterotomy can cause pancreatic duct edema/obstruction, leading to pancreatitis — the most common complication.'},
{sec:'Diagnostics', q:'PTBD (percutaneous transhepatic biliary drainage) is best described as:', opts:['A purely diagnostic test','A therapeutic drainage procedure','An oral contrast study','A form of ultrasound-guided biopsy'], correct:1, exp:'PTC is diagnostic (cholangiography); PTBD is the therapeutic component — a catheter placed for drainage.'},
{sec:'Diagnostics', q:'Which imaging is most sensitive for diagnosing acute cholecystitis but not used to detect stones?', opts:['MRCP','HIDA scan','CT scan','Ultrasound'], correct:1, exp:'HIDA scan is very sensitive for acute cholecystitis (non-visualization of the GB) but is not used to detect stones alone.'},
{sec:'Physiology', q:'What is the most abundant electrolyte in bile?', opts:['Potassium','Calcium','Sodium','Chloride'], correct:2, exp:'Sodium is the most abundant electrolyte in bile, present at similar concentration to plasma/ECF.'},
{sec:'Physiology', q:'Which hormone is released by duodenal S cells in response to food and stimulates bile secretion?', opts:['Cholecystokinin','Secretin','Gastrin','Somatostatin'], correct:1, exp:'Secretin, released by S cells, stimulates bile secretion, gallbladder contraction, and pancreatic fluid secretion.'},
{sec:'Physiology', q:'Which hormone has the most direct effect on gallbladder contraction?', opts:['Secretin','Gastrin','Cholecystokinin (CCK)','Motilin'], correct:2, exp:'CCK directly stimulates gallbladder contraction, particularly in response to fatty meals.'},
{sec:'Physiology', q:'A biliary fistula draining more than 1 L per day most likely indicates:', opts:['Normal enterohepatic circulation','Complete distal obstruction','Cholangitis','Gallbladder hydrops'], correct:1, exp:'High-output drainage (>1L/day) suggests that bile is not passing normally into the duodenum — i.e., complete obstruction distally.'},
{sec:'Physiology', q:'What is the primary event leading to formation of a cholesterol gallstone?', opts:['Increased bilirubin turnover','Bacterial infection of bile','Supersaturation of bile with cholesterol','Excess bile salt secretion'], correct:2, exp:'When cholesterol concentration exceeds the solubilizing capacity of bile salts and phospholipids, cholesterol precipitates out of solution, forming a stone.'},
{sec:'Physiology', q:'What type of gallstone is classically associated with hemolytic disease?', opts:['Cholesterol stones','Black pigment stones','Mixed stones','Calcium carbonate stones'], correct:1, exp:'Hemolytic disease increases bilirubin turnover, promoting formation of black pigment stones.'},
{sec:'Cholelithiasis', q:'Which of the following is NOT part of the classic "3 F\'s" risk profile for gallstones?', opts:['Female','Fat','Forty','Febrile'], correct:3, exp:'The classic profile is Female, Fat, and Forty (age) — not "Febrile."'},
{sec:'Cholelithiasis', q:'A patient with biliary colic reports pain radiating to the right scapular area. Where is the pain typically originating?', opts:['Epigastric pain','RUQ pain','LUQ pain','Periumbilical pain'], correct:1, exp:'RUQ pain classically radiates to the right scapular area/shoulder, while epigastric pain radiates directly to the mid-back.'},
{sec:'Cholelithiasis', q:'Which is the standard confirmatory diagnostic test for cholelithiasis?', opts:['CT scan','Abdominal ultrasound','HIDA scan','ERCP'], correct:1, exp:'Abdominal ultrasound is the standard/confirmatory test given its wide availability and high accuracy in detecting gallstones.'},
{sec:'Cholelithiasis', q:'Which is NOT an indication for prophylactic cholecystectomy in asymptomatic cholelithiasis?', opts:['Empyema of the gallbladder','Seafarers not cleared to work','Porcelain gallbladder','Patients with limited access to surgical care'], correct:0, exp:'Empyema is a complication requiring urgent treatment, not a criterion for "prophylactic" surgery in an asymptomatic patient — the other three are accepted relative indications.'},
{sec:'Cholelithiasis', q:'What is the standard treatment for symptomatic cholelithiasis?', opts:['Prophylactic cholecystectomy','Cholecystectomy','Percutaneous cholecystostomy','Observation with dietary modification'], correct:1, exp:'Cholecystectomy (preferably laparoscopic) is the standard of care for symptomatic gallstone disease.'},
{sec:'Cholelithiasis', q:'In acute cholecystitis, what is the preferred timing for "early" cholecystectomy?', opts:['Immediately upon admission, no delay','Within 24–72 hours','Beyond 72 hours after interval treatment','After 2 weeks of antibiotics'], correct:1, exp:'Early cholecystectomy, performed within 24–72 hours, is preferred for acute cases as most patients do not improve significantly with prolonged delay.'},
{sec:'Cholelithiasis', q:'A 29-year-old female develops worsening abdominal pain and jaundice 5 days after laparoscopic cholecystectomy for chronic cholecystitis. Which is the LEAST likely cause?', opts:['Bile duct stricture','Bile leak','Retained bile duct stone','Viral hepatitis'], correct:3, exp:'Viral hepatitis would not typically present acutely 5 days post-op in this manner; the other options are recognized post-cholecystectomy complications related to bile duct injury.'},
{sec:'Cholelithiasis', q:'A 58-year-old male in the ICU with severe burns develops abdominal pain; ultrasound/CT show gallbladder wall thickening and inflammation WITHOUT visible stones. What is the appropriate management?', opts:['Do ERCP','Give antibiotics and antispasmodics','Percutaneous cholecystostomy','Watchful waiting'], correct:2, exp:'This is acalculous cholecystitis in a critically ill patient — percutaneous cholecystostomy is the best treatment of choice when the patient is unfit for surgery.'},
{sec:'Cholelithiasis', q:'What is the acute intestinal obstruction caused by a large gallstone eroding through a cholecystoduodenal fistula called?', opts:['Bouveret syndrome','Gallstone ileus','Mirizzi syndrome','Boerhaave syndrome'], correct:1, exp:'Gallstone ileus occurs when a large stone passes into the bowel and impacts, typically at the ileocecal junction. Bouveret syndrome is the proximal (gastric outlet) variant.'},
{sec:'Cholelithiasis', q:'What is the mechanism behind Mirizzi syndrome?', opts:['Intraluminal CBD stone obstruction','External compression of the common hepatic duct by a stone in the GB neck/cystic duct','Malignant stricture of the CBD','Sphincter of Oddi dysfunction'], correct:1, exp:'Mirizzi syndrome results from external compression (not an intrinsic duct lesion), caused by a large stone impacted in the GB neck/cystic duct with surrounding inflammation.'},
{sec:'Cholelithiasis', q:'What is the most common cause of intestinal obstruction overall (more common than gallstone ileus)?', opts:['Hernias','Postoperative adhesions','Volvulus','Intussusception'], correct:1, exp:'Postoperative adhesions remain the most common overall cause of intestinal obstruction.'},
{sec:'Cholelithiasis', q:'Which of the following is an ABSOLUTE contraindication to laparoscopic cholecystectomy?', opts:['Mild hypertension','Frank peritonitis','Well-controlled diabetes','Age over 70'], correct:1, exp:'Absolute contraindications include hemodynamic instability, uncontrolled coagulopathy, frank peritonitis, COPD, and CHF.'},
{sec:'Cholelithiasis', q:'What is the most dreaded complication of cholecystectomy?', opts:['Wound infection','Bile duct injury','DVT','Postoperative ileus'], correct:1, exp:'Bile duct injury (<0.5% incidence) is considered the most dreaded complication, presenting with abdominal pain, jaundice, and sepsis.'},
{sec:'Cholelithiasis', q:'A patient presents days after cholecystectomy with suspected bile leak. What imaging should be requested?', opts:['Plain abdominal X-ray','ERCP or MRI','Barium swallow','HIDA scan only'], correct:1, exp:'ERCP or MRI is used to confirm and assess the extent of a suspected bile duct injury/leak prior to surgical repair.'},
{sec:'Choledochal Cyst', q:'What is the classic triad of choledochal cyst?', opts:['Pain, fever, jaundice','Pain, jaundice, palpable mass','Fever, jaundice, hypotension','Pain, vomiting, mass'], correct:1, exp:'The classic triad is abdominal pain, jaundice, and a palpable mass.'},
{sec:'Choledochal Cyst', q:'Which choledochal cyst type is the most common?', opts:['Type I (fusiform)','Type II (saccular)','Type III (choledochocele)','Type V (Caroli)'], correct:0, exp:'Type I, fusiform dilatation of the CBD, accounts for 80–90% of choledochal cysts and carries the highest malignancy risk (>60%).'},
{sec:'Choledochal Cyst', q:'Which choledochal cyst type is managed by surveillance/sphincterotomy rather than formal excision, given its low malignancy risk?', opts:['Type I','Type II','Type III','Type IV'], correct:2, exp:'Type III (choledochocele) has the lowest malignancy risk (~2%), so sphincterotomy plus surveillance is generally preferred over resection, which would otherwise require pancreaticoduodenectomy.'},
{sec:'Choledochal Cyst', q:'Type V choledochal cyst is also known as:', opts:['Klatskin cyst','Caroli disease','Mirizzi cyst','Bouveret cyst'], correct:1, exp:'Type V, intrahepatic biliary cysts, is also called Caroli disease and may require liver transplantation in advanced disease.'},
{sec:'Choledochal Cyst', q:'What is the rarest type of choledochal cyst?', opts:['Type I','Type II','Type IV','Type V'], correct:3, exp:'Type V (Caroli disease/intrahepatic) is the rarest, making up only about 1% of cases.'},
{sec:'Benign/Inflammatory', q:'Which of the following pathophysiologic mechanisms is NOT typically associated with acalculous cholecystitis?', opts:['Gallbladder distention','Bile stasis','Stone impaction','Ischemia from low-flow state'], correct:2, exp:'By definition, acalculous cholecystitis occurs WITHOUT gallstones; stone impaction is not part of its mechanism.'},
{sec:'Benign/Inflammatory', q:'In the Philippines, acalculous cholecystitis is often seen as a complication of which conditions?', opts:['Malaria and leptospirosis','Dengue and typhoid fever','Tuberculosis and amoebiasis','Hepatitis A and B'], correct:1, exp:'Dr. Nolasco notes that dengue and typhoid fever commonly cause acalculous cholecystitis in the Philippine setting, often resolving spontaneously.'},
{sec:'Benign/Inflammatory', q:'What size threshold for a gallbladder polyp warrants surgical removal?', opts:['≥0.5 cm','≥1 cm','≥2 cm','≥3 cm'], correct:1, exp:'Polyps ≥1 cm (or symptomatic ones) are indications for cholecystectomy, since polyps <1 cm rarely become malignant.'},
{sec:'Benign/Inflammatory', q:'Which type of gallbladder polyp is more likely to be malignant?', opts:['Cholesterol polyp','Adenomatous polyp','Hyperplastic polyp','Inflammatory polyp'], correct:1, exp:'Adenomatous polyps carry a risk for gallbladder cancer, unlike the more common (and typically benign) cholesterol polyps.'},
{sec:'Benign/Inflammatory', q:'Secondary choledocholithiasis stones are usually composed of:', opts:['Brown pigment','Black pigment','Cholesterol','Calcium carbonate'], correct:2, exp:'Secondary stones form in the gallbladder (usually cholesterol stones) and migrate into the CBD via the cystic duct — this is the more common pattern overall.'},
{sec:'Benign/Inflammatory', q:'Primary choledocholithiasis is more strongly associated with which of the following?', opts:['Western diet and obesity','Biliary stasis and infection, more common in Asians','Rapid weight loss','Oral contraceptive use'], correct:1, exp:'Primary stones form within the bile duct itself, associated with biliary stasis/infection, and are more commonly seen in Asian populations.'},
{sec:'Benign/Inflammatory', q:'What causes acholic stool in a patient with choledocholithiasis?', opts:['Excess unconjugated bilirubin','Absence of stercobilinogen due to blocked bile flow','Increased bile salt reabsorption','Pancreatic enzyme deficiency'], correct:1, exp:'When bilirubin cannot pass through the ampulla into the intestines, stercobilinogen (which colors stool) is absent, resulting in pale/acholic stool.'},
{sec:'Benign/Inflammatory', q:'A 30-year-old female has 2 weeks of intermittent colicky RUQ pain, followed by jaundice. Total, conjugated bilirubin, and ALP are elevated; ALT, AST, and unconjugated bilirubin are normal. What is the most likely diagnosis?', opts:['Cholecystitis','Choledocholithiasis','Hepatitis','Sickle cell disease'], correct:1, exp:'This pattern (elevated conjugated bilirubin and ALP, normal transaminases) reflects obstructive jaundice from a common bile duct stone — choledocholithiasis.'},
{sec:'Benign/Inflammatory', q:'What is the imaging modality preferred for evaluating suspected choledocholithiasis due to its high sensitivity/specificity and excellent anatomic detail?', opts:['Plain abdominal X-ray','Ultrasound alone','MRCP','HIDA scan'], correct:2, exp:'MRCP is preferred, offering 95% sensitivity and 89% specificity for detecting bile duct stones.'},
{sec:'Benign/Inflammatory', q:'Which country/region is hepatolithiasis considered endemic?', opts:['Western Europe','East and Southeast Asia','Sub-Saharan Africa','North America'], correct:1, exp:'Hepatolithiasis (intrahepatic stones) is endemic to East and Southeast Asia, often related to biliary parasitic/bacterial infection.'},
{sec:'Benign/Inflammatory', q:'Which management option for hepatolithiasis carries the LOWEST risk of recurrence?', opts:['Hepaticojejunostomy','Hepatectomy','Choledochojejunostomy','PTBD alone'], correct:1, exp:'Hepatectomy (resection of the affected liver segment/lobe) carries the lowest recurrence risk among the treatment options, especially in unilateral disease.'},
{sec:'Benign/Inflammatory', q:'What is "Oriental Cholangiohepatitis" also known as?', opts:['Primary sclerosing cholangitis','Recurrent pyogenic cholangitis','Acute suppurative cholangitis','Autoimmune hepatitis'], correct:1, exp:'Recurrent pyogenic cholangitis is also called Oriental Cholangiohepatitis, a complication of hepatolithiasis very common in East Asia.'},
{sec:'Benign/Inflammatory', q:'Which of the following is NOT part of Reynold\'s Pentad?', opts:['Charcot\'s Triad','Seizures','Shock','Altered mental status'], correct:1, exp:'Reynold\'s Pentad = Charcot\'s Triad (RUQ pain, jaundice, fever) + shock + altered mental status. Seizures are not part of the pentad.'},
{sec:'Benign/Inflammatory', q:'What is the recommended treatment approach for cholangitis?', opts:['Elective ERCP after outpatient workup','Broad-spectrum antibiotics, biliary drainage, and resuscitation as urgent management','Observation with oral antibiotics','Immediate cholecystectomy only'], correct:1, exp:'Cholangitis is treated as a very urgent condition — patients can deteriorate within 24 hours — requiring immediate broad-spectrum antibiotics, biliary drainage, and resuscitation.'},
{sec:'Benign/Inflammatory', q:'Which organism is a common cause of cholangitis?', opts:['Staphylococcus aureus','E. coli','Streptococcus pyogenes','Candida albicans'], correct:1, exp:'E. coli, along with Klebsiella, S. faecalis, Enterobacter sp., and Bacteroides fragilis, are the common enteric organisms causing cholangitis.'},
{sec:'Benign/Inflammatory', q:'Primary Sclerosing Cholangitis (PSC) is most strongly associated with which condition?', opts:['Crohn\'s disease','Ulcerative colitis','Celiac disease','Irritable bowel syndrome'], correct:1, exp:'About ⅔ of PSC patients have ulcerative colitis.'},
{sec:'Benign/Inflammatory', q:'What is the typical demographic for PSC?', opts:['Female-predominant, ages 20-30','Male-predominant (2:1), ages 30-45','Equal M:F, ages 50-60','Female-predominant, ages 60-70'], correct:1, exp:'PSC is male-predominant (M:F 2:1), with a mean age of 30-45 years, and is autoimmune in origin.'},

let quizOrder = QUIZ.map((_,i)=>i);
let quizAnswers = new Array(QUIZ.length).fill(null);
let quizIdx = 0;

document.getElementById('quizStartBtn').onclick = ()=>{
  document.getElementById('quizIntro').classList.add('hidden');
  document.getElementById('quizPlay').classList.remove('hidden');
  document.getElementById('quizScoreScreen').classList.add('hidden');
  quizIdx = 0;
  quizAnswers = new Array(QUIZ.length).fill(null);
  renderQuestion();
};

function renderQuestion(){
  const q = QUIZ[quizIdx];
  document.getElementById('qMeta').textContent = 'Question '+(quizIdx+1)+' of '+QUIZ.length+'  ·  Section: '+q.sec;
  document.getElementById('qPrompt').textContent = q.q;
  const optsDiv = document.getElementById('qOptions');
  optsDiv.innerHTML='';
  const exp = document.getElementById('qExplain');
  exp.classList.remove('show');
  exp.innerHTML='';

  q.opts.forEach((optText, i)=>{
    const btn = document.createElement('button');
    btn.className='qopt';
    btn.textContent = optText;
    const prevAns = quizAnswers[quizIdx];
    if(prevAns!==null){
      if(i===q.correct) btn.classList.add('correct');
      if(i===prevAns && i!==q.correct) btn.classList.add('incorrect');
    }
    btn.onclick = ()=>{
      if(quizAnswers[quizIdx]!==null) return; // already answered
      quizAnswers[quizIdx]=i;
      renderQuestion();
      showExplain();
    };
    optsDiv.appendChild(btn);
  });
  if(quizAnswers[quizIdx]!==null) showExplain();
  document.getElementById('qPrevBtn').disabled = quizIdx===0;
  document.getElementById('qNextBtn').textContent = quizIdx===QUIZ.length-1 ? 'Finish' : 'Next →';
}

function showExplain(){
  const q = QUIZ[quizIdx];
  const exp = document.getElementById('qExplain');
  const correctLabel = quizAnswers[quizIdx]===q.correct ? '✅ Correct.' : '❌ Not quite.';
  exp.innerHTML = '<b>'+correctLabel+'</b> '+q.exp;
  exp.classList.add('show');
}

document.getElementById('qPrevBtn').onclick = ()=>{ if(quizIdx>0){ quizIdx--; renderQuestion(); } };
document.getElementById('qNextBtn').onclick = ()=>{
  if(quizIdx<QUIZ.length-1){ quizIdx++; renderQuestion(); }
  else { finishQuiz(); }
};

function finishQuiz(){
  document.getElementById('quizPlay').classList.add('hidden');
  document.getElementById('quizScoreScreen').classList.remove('hidden');
  let score=0;
  QUIZ.forEach((q,i)=>{ if(quizAnswers[i]===q.correct) score++; });
  document.getElementById('scoreNum').textContent = score+' / '+QUIZ.length;
  const pct = Math.round(score/QUIZ.length*100);
  let msg = pct>=80?'Excellent work — you\'re board-ready on this topic!':pct>=60?'Solid grasp — review the missed items below.':'Keep reviewing — revisit the core topic tabs and try again.';
  document.getElementById('scoreMsg').textContent = msg+' ('+pct+'%)';
  document.getElementById('reviewList').classList.add('hidden');
  document.getElementById('reviewList').innerHTML='';
}

document.getElementById('reviewBtn').onclick = ()=>{
  const list = document.getElementById('reviewList');
  list.classList.toggle('hidden');
  if(!list.classList.contains('hidden') && list.innerHTML===''){
    QUIZ.forEach((q,i)=>{
      const correct = quizAnswers[i]===q.correct;
      const div = document.createElement('div');
      div.className='review-item '+(correct?'right':'wrong');
      div.innerHTML = '<b>Q'+(i+1)+'. '+q.q+'</b><br>Your answer: '+(quizAnswers[i]!==null?q.opts[quizAnswers[i]]:'(skipped)')+'<br>Correct answer: '+q.opts[q.correct]+'<br><span style="font-size:.85rem;color:var(--ink-soft)">'+q.exp+'</span>';
      list.appendChild(div);
    });
  }
};
document.getElementById('retakeBtn').onclick = ()=>{
  document.getElementById('quizScoreScreen').classList.add('hidden');
  document.getElementById('quizIntro').classList.remove('hidden');
};
</script>
